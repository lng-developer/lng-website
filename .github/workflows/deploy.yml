name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Deploy to VPS
      uses: appleboy/ssh-action@v0.1.6
      with:
        host: 157.245.198.212
        username: root
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          cd ~/lng-website
          git pull origin main
          npm install
          pm2 restart lng-be
