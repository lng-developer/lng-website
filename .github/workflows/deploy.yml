name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Deploy to VPS
      uses: appleboy/ssh-action@v0.1.6
      with:
        host: 157.245.198.212
        username: root
        key: ${{ secrets.VPS_SSH_KEY }}
        script_stop: true
        script: |
          set -euo pipefail
          cd ~/lng-website
          git pull --ff-only origin main
          npm ci
          pm2 restart lng-be --update-env
          git rev-parse HEAD
